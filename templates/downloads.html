{% extends "base.html" %}

{% block content %}
  <section class="page-hero">
    <div>
      <h1>{{ page_heading }}</h1>
      <p>{{ page_description }}</p>
    </div>
  </section>

  <section class="page-summary-grid page-summary-grid-compact">
    {% for card in summary_cards %}
      <article class="panel summary-card">
        <span>{{ card.label }}</span>
        <strong>{{ card.value }}</strong>
      </article>
    {% endfor %}
  </section>

  <section class="download-grid">
    {% for row in download_rows %}
      <article class="panel download-card">
        <h2>{{ row.label }}</h2>
        <p>{{ row.description }}</p>
        <a class="primary-button button-link" href="{{ row.href }}">Abrir arquivo</a>
      </article>
    {% endfor %}
  </section>
{% endblock %}
