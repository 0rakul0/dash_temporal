{% extends "base.html" %}

{% block content %}
  <section class="page-hero">
    <div>
      <h1>{{ page_heading }}</h1>
      <p>{{ page_description }}</p>
    </div>
  </section>

  <section class="page-summary-grid page-summary-grid-compact" id="summary-grid"></section>

  <section class="page-grid-two">
    <article class="panel">
      <div class="panel-header">
        <h2>Variacao por orgao</h2>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Orgao</th>
              <th>Recentes</th>
              <th>Anteriores</th>
              <th>Variacao</th>
            </tr>
          </thead>
          <tbody id="alert-body"></tbody>
        </table>
      </div>
    </article>

    <article class="panel">
      <div class="panel-header">
        <h2>Atos recentes na janela</h2>
      </div>
      <div class="timeline-list" id="timeline-list"></div>
    </article>
  </section>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/page-data.js') }}"></script>
{% endblock %}
