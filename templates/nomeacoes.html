{% extends "base.html" %}

{% block content %}
  <section class="page-hero">
    <div>
      <h1>{{ page_heading }}</h1>
      <p>{{ page_description }}</p>
    </div>
  </section>

  <section class="page-summary-grid" id="summary-grid"></section>

  <section class="page-grid-two">
    <article class="panel">
      <div class="panel-header">
        <h2>Atos recentes</h2>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Pessoa</th>
              <th>Orgao</th>
              <th>Cargo</th>
              <th>Governo</th>
            </tr>
          </thead>
          <tbody id="recent-table-body"></tbody>
        </table>
      </div>
    </article>

    <article class="panel">
      <div class="panel-header">
        <h2>Orgaos com mais entradas</h2>
      </div>
      <div class="list-stack" id="orgao-list"></div>
    </article>
  </section>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/page-data.js') }}"></script>
{% endblock %}
