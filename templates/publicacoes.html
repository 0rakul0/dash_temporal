{% extends "base.html" %}

{% block content %}
  <section class="page-hero">
    <div>
      <h1>{{ page_heading }}</h1>
      <p>{{ page_description }}</p>
    </div>
  </section>

  <section class="page-summary-grid" id="summary-grid"></section>

  <section class="page-grid-two">
    <article class="panel">
      <div class="panel-header">
        <h2>Volume por mes</h2>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Mes</th>
              <th>Atos</th>
              <th>Nomeacoes</th>
              <th>Exoneracoes</th>
            </tr>
          </thead>
          <tbody id="publication-body"></tbody>
        </table>
      </div>
    </article>

    <article class="panel">
      <div class="panel-header">
        <h2>Dias com maior densidade</h2>
      </div>
      <div class="list-stack" id="day-list"></div>
    </article>
  </section>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/page-data.js') }}"></script>
{% endblock %}
